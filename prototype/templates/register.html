{% extends "base.html" %}
{% block title %}Create Account — Muster{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="section-label">New Recruit</div>
  <h1 class="section-title">Set up your muster log.</h1>
  <form method="POST" class="form-stack">
    <label>
      <span>Username</span>
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>
      <span>Email</span>
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>
      <span>Password</span>
      <input type="password" name="password" autocomplete="new-password" required minlength="6">
    </label>
    <button type="submit" class="btn-primary full">Create Account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
